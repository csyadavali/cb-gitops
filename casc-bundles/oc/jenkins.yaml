configuration-as-code: {
  }
credentials:
  folder: {
    }
  providerImpl: {
    }
  system:
    domainCredentials:
    - credentials:
      - usernamePassword:
          id: "dockerhub-creds"
          password: "${DOCKERHUB_CREDS_PASSWORD}"
          scope: GLOBAL
          username: "sekharyr"
      domain: {
        }
  user: {
    }
jenkins:
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  crumbIssuer: "standard"
  disableRememberMe: false
  disabledAdministrativeMonitors:
  - "com.cloudbees.opscenter.server.security.SharedCredentialsAdminMonitor"
  - "com.cloudbees.masterprovisioning.kubernetes.PSSMonitorTrigger$PSSDisabledAdminMonitor"
  - "jenkins.diagnostics.ControllerExecutorsNoAgents"
  - "jenkins.security.csp.impl.CspRecommendation"
  - "hudson.diagnosis.ReverseProxySetupMonitor"
  labelAtoms:
  - name: "built-in"
  log: {
    }
  markupFormatter: "plainText"
  mode: NORMAL
  noUsageStatistics: true
  nodeMonitors:
  - "architecture"
  - "clock"
  - diskSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "swapSpace"
  - tmpSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "responseTime"
  numExecutors: 2
  primaryView:
    masters:
      columns:
      - "status"
      - "weather"
      - "jobName"
      - "manageMaster"
      - "masterPodStatusViewColumn"
      - "masterConfigurationStaleViewColumn"
      - "totalJobsViewColumn"
      - "queueSizeViewColumn"
      - "jenkinsVersionViewColumn"
      - "listSelectionColumn"
      jobFilters:
      - "connectedMasterViewFilter"
      name: "Controllers"
      recurse: true
  projectNamingStrategy: "standard"
  quietPeriod: 5
  remotingSecurity:
    enabled: true
  scmCheckoutRetryCount: 0
  securityRealm:
    local:
      allowsSignup: false
      enableCaptcha: false
      users:
      - id: "syadavali"
        name: "Sekhar"
        properties:
        - "consoleUrlProvider"
        - "viewsTabBar"
        - myView:
            viewsTabBar: "standard"
        - preferredProvider:
            providerId: "default"
        - "timezone"
        - "experimentalFlags"
        - mailer:
            emailAddress: "sekhar.yadavali@terralogic.com"
        - "apiToken"
  slaveAgentPort: 50000
  updateCenter:
    sites:
    - id: "core-oc-offline"
      url: "file:/tmp/jenkins/war/WEB-INF/plugins/update-center.json"
    - id: "cap-core-oc"
      url: "https://jenkins-updates.cloudbees.com/update-center/envelope-core-oc/update-center.json"
  views:
  - masters:
      columns:
      - "status"
      - "weather"
      - "jobName"
      - "manageMaster"
      - "masterPodStatusViewColumn"
      - "masterConfigurationStaleViewColumn"
      - "totalJobsViewColumn"
      - "queueSizeViewColumn"
      - "jenkinsVersionViewColumn"
      - "listSelectionColumn"
      jobFilters:
      - "connectedMasterViewFilter"
      name: "Controllers"
      recurse: true
  - all:
      name: "all"
  viewsTabBar: "standard"
cloudbees-monitoring: {
  }
advisor:
  acceptToS: true
beekeeper:
  enabled: true
  securityWarnings:
    enabledForCore: true
    enabledForPlugins: true
  upgrades:
    autoDowngradePlugins: false
    autoUpgradePlugins: true
cloudBeesCasCServer:
  disableRemoteValidation: false
  visibility: false
controllerLifecycleNotifications:
  authenticator: "none"
  enabled: false
  ignoreTlsConnectionErrors: false
license:
  certificate: "${CJOC_LICENSE_CERT}"
  key: "${CJOC_LICENSE_KEY}"
masterprovisioning:
  dockerImageDefinitionConfiguration:
    images:
    - imageTag: "cloudbees/cloudbees-core-mm:2.555.3.36985"
      name: "CloudBees CI - Managed Controller - 2.555.3.36985"
  kubernetes:
    clusterEndpoints:
    - id: "default"
      jenkinsUrl: "http://cjoc.cloudbees-core.svc.cluster.local/"
      name: "kubernetes"
      serviceExposure:
        gateway:
          gatewayName: "cloudbees-gateway"
          gatewayNamespace: "cloudbees-core"
    cpus: "1.0"
    disk: 50
    fsGroup: "1000"
    globalJavaOptions: "-Dorg.csanchez.jenkins.plugins.kubernetes.pipeline.PodTemplateStepExecution.defaultImage=cloudbees/cloudbees-core-agent:2.555.3.36985\
      \ -Dcom.cloudbees.jenkins.plugins.kube.ServiceAccountFilter.defaultServiceAccount=jenkins-agents\
      \ -Dcom.cloudbees.networking.useSubdomain=true -Dcom.cloudbees.networking.protocol=\"\
      https\" -Dcom.cloudbees.networking.hostname=\"aws.syadavali.ps.beescloud.com\"\
      \ -Dcom.cloudbees.networking.port=443 -Dcom.cloudbees.networking.operationsCenterName=\"\
      cjoc\""
    javaOptions: "-XshowSettings:vm -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+ParallelRefProcEnabled\
      \ -XX:+UseStringDeduplication -XX:+AlwaysActAsServerClassMachine -Dhudson.slaves.NodeProvisioner.initialDelay=0\
      \ -XX:-OmitStackTraceInFastThrow"
    livenessInitialDelaySeconds: 0
    livenessPeriodSeconds: 10
    livenessTimeoutSeconds: 10
    memory: 3072
    readinessFailureThreshold: 3
    readinessInitialDelaySeconds: 0
    readinessTimeoutSeconds: 5
    startupFailureThreshold: 100
    startupInitialDelaySeconds: 30
    startupPeriodSeconds: 10
    startupTimeoutSeconds: 5
    terminationGracePeriodSeconds: 30
