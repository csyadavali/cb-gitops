removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: managedController
  name: mc-efs
  configuration:
    kubernetes:
      allowExternalAgents: false
      replication:
        config:
          maxReplicas: 0
          replicas: 1
          targetCPUUtilizationPercentage: 80
      terminationGracePeriodSeconds: 30
      image: CloudBees CI - Managed Controller - 2.555.3.36985
      memory: 4000
      startupPeriodSeconds: 10
      fsGroup: '1000'
      cpus: 2.0
      readinessTimeoutSeconds: 5
      startupFailureThreshold: 100
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
      clusterEndpointId: default
      disk: 50
      readinessFailureThreshold: 3
      livenessTimeoutSeconds: 10
      storageClassName: efs-sc
      domain: mc-efs
      livenessPeriodSeconds: 10
      startupTimeoutSeconds: 5
      startupInitialDelaySeconds: 30
      javaOptions: -XshowSettings:vm -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+ParallelRefProcEnabled
        -XX:+UseStringDeduplication -XX:+AlwaysActAsServerClassMachine -Dhudson.slaves.NodeProvisioner.initialDelay=0
        -XX:-OmitStackTraceInFastThrow
        -Dcom.cloudbees.jenkins.plugins.assurance.model.Product.ucBase=http://uc-test-proxy.cloudbees-core.svc.cluster.local:8080
        -Dcom.cloudbees.jenkins.cjp.installmanager.casc.plugin.management.CloudBeesUCUrlConfiguration.json=http://uc-test-proxy.cloudbees-core.svc.cluster.local:8080/update-center
        -Dcom.cloudbees.jenkins.cjp.installmanager.casc.plugin.management.CloudBeesUCUrlConfiguration.plugins=http://uc-test-proxy.cloudbees-core.svc.cluster.local:8080/plugins
      yaml: |
        kind: Deployment
        spec:
          template:
            spec:
              containers:
              - name: jenkins
                volumeMounts:
                - name: jfrog-trial-token
                  mountPath: /run/secrets/jfrog_trial_token
                  subPath: jfrog_trial_token
                  readOnly: true
              volumes:
              - name: jfrog-trial-token
                secret:
                  secretName: jfrog-trial-token
  description: ''
  displayName: mc-efs
  properties:
  - customWebhookData: {}
  - sharedHeaderLabelOptIn:
      optIn: true
  - healthReporting:
      enabled: true
  - owner:
      delay: 5
      owners: ''
  - envelopeExtension:
      allowExceptions: false
  - sharedConfigurationOptOut:
      optOut: false
  - configurationAsCode:
      bundle: main/mc-efs
