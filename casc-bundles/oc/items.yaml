removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: managedController
  name: mc-efs
  configuration:
    kubernetes:
      allowExternalAgents: false
      replication:
        config:
          maxReplicas: 0
          replicas: 1
          targetCPUUtilizationPercentage: 80
      terminationGracePeriodSeconds: 30
      image: CloudBees CI - Managed Controller - 2.555.3.36985
      memory: 4000
      startupPeriodSeconds: 10
      fsGroup: '1000'
      cpus: 2.0
      readinessTimeoutSeconds: 5
      startupFailureThreshold: 100
      livenessInitialDelaySeconds: 0
      readinessInitialDelaySeconds: 0
      clusterEndpointId: default
      disk: 50
      readinessFailureThreshold: 3
      livenessTimeoutSeconds: 10
      storageClassName: efs-sc
      domain: mc-efs
      livenessPeriodSeconds: 10
      startupTimeoutSeconds: 5
      startupInitialDelaySeconds: 30
      javaOptions: -XshowSettings:vm -XX:+AlwaysPreTouch -XX:+DisableExplicitGC -XX:+ParallelRefProcEnabled
        -XX:+UseStringDeduplication -XX:+AlwaysActAsServerClassMachine -Dhudson.slaves.NodeProvisioner.initialDelay=0
        -XX:-OmitStackTraceInFastThrow
      yaml: |
        apiVersion: apps/v1
        kind: ${workloadKind}
        spec:
          template:
            spec:
              containers:
              - name: jenkins
                envFrom:
                - secretRef:
                    name: shared-secrets
                    optional: true
                - secretRef:
                    name: controller-secrets
                    optional: true
                volumeMounts:
                - name: jfrog-trial-token
                  mountPath: /run/secrets/jfrog_trial_token
                  subPath: jfrog_trial_token
                  readOnly: true
                - name: casc-secrets-properties
                  mountPath: /run/secrets/secrets.properties
                  subPath: secrets.properties
                  readOnly: true
                - name: shared-store
                  mountPath: /mnt/shared-store
                  readOnly: true
                - name: controller-store
                  mountPath: /mnt/controller-store
                  readOnly: true
              volumes:
              - name: jfrog-trial-token
                secret:
                  secretName: jfrog-trial-token
              - name: casc-secrets-properties
                secret:
                  secretName: ${name}-casc-secrets
              - name: shared-store
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: shared-sm
              - name: controller-store
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: controller-sm
        ---
        apiVersion: secrets-store.csi.x-k8s.io/v1
        kind: SecretProviderClass
        metadata:
          name: shared-sm
        spec:
          provider: aws
          parameters:
            region: us-east-1
            usePodIdentity: "true"
            objects: |
              - objectName: cbci-test/shared/demo
                objectType: secretsmanager
                jmesPath:
                  - path: token
                    objectAlias: sharedToken
          secretObjects:
          - secretName: shared-secrets
            type: Opaque
            data:
            - objectName: sharedToken
              key: SHARED_TOKEN
        ---
        apiVersion: secrets-store.csi.x-k8s.io/v1
        kind: SecretProviderClass
        metadata:
          name: controller-sm
        spec:
          provider: aws
          parameters:
            region: us-east-1
            usePodIdentity: "true"
            objects: |
              - objectName: cbci-test/${name}/demo
                objectType: secretsmanager
                jmesPath:
                  - path: username
                    objectAlias: ctrlUser
                  - path: password
                    objectAlias: ctrlPass
          secretObjects:
          - secretName: controller-secrets
            type: Opaque
            data:
            - objectName: ctrlUser
              key: CONTROLLER_USERNAME
            - objectName: ctrlPass
              key: CONTROLLER_PASSWORD
  description: ''
  displayName: mc-efs
  properties:
  - customWebhookData: {}
  - sharedHeaderLabelOptIn:
      optIn: true
  - healthReporting:
      enabled: true
  - owner:
      delay: 5
      owners: ''
  - envelopeExtension:
      allowExceptions: false
  - sharedConfigurationOptOut:
      optOut: false
  - configurationAsCode:
      bundle: main/mc-efs
