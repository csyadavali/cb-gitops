# CasC plugin management v2 (bundle apiVersion 2).
# Non-CAP plugins are listed as plain ids; their versions and all transitive dependencies are resolved
# automatically and downloaded through uc-test-proxy -> JFrog mirror (the proxy URLs are set as JVM
# properties on this controller in the OC bundle: Product.ucBase and CloudBeesUCUrlConfiguration.json/.plugins).
# Dependency-resolution test plugins: build-pipeline-plugin, buildgraph-view, buildresult-trigger.
# Three-kinds test (one of each):
#   - CAP plugin, plain id          : aws-global-configuration (installed from the WAR, no network)
#   - non-CAP plugin, plain id      : agent-maintenance (+ its dependency flatpickr-api, via proxy + mirror)
#   - custom plugin, url + credential: Exclusion (downloaded directly from an authenticated JFrog repository;
#                                      the token is read from a file mounted from a Kubernetes secret)
