removeStrategy:
  rbac: SYNC
  items: NONE
items:
- kind: pipeline
  name: bench-target-efs-sc-MAX_SURVIVABILITY-1
  concurrentBuild: true
  definition:
    cpsScmFlowDefinition:
      scriptPath: Jenkinsfile.target
      scm:
        scmGit:
          gitTool: Default
          userRemoteConfigs:
          - userRemoteConfig:
              url: https://github.com/sekharyr/cjoc-storage-benchmark
          branches:
          - branchSpec:
              name: '*/main'
      lightweight: false
  description: ''
  disabled: false
  displayName: bench-target-efs-sc-MAX_SURVIVABILITY-1
  properties:
  - parameters:
      parameterDefinitions:
      - string:
          trim: false
          name: UNIQUE_STAMP
          description: Unique value baked into this build's one artifact — supplied
            by benchDriver, not meant to be set by hand
      - booleanParam:
          defaultValue: false
          name: REALISTIC_SERVICE_MODE
          description: 'Off (default) = minimal per-build work: produce one uniquely-stamped,
            fingerprinted artifact (the controller-side small-file storage signal).
            On = also run the full unit-test/integration-test/log-flood/docker/soak/CloudWatch
            sequence — the "does this storage choice bottleneck a real build" question.
            Heavier on the agent AND controller (log flood streams to the controller);
            defaults off for controller-memory safety.'
      - string:
          trim: false
          defaultValue: openzfs-sc
          name: STORAGE_CLASS
          description: Informational label + selects the CloudWatch resource ID (see
            the map in vars/benchStages.groovy). Should match the controller this
            target job runs on — benchDriver passes it through from the orchestrator.
            Only used in realistic mode.
      - string:
          trim: false
          defaultValue: '1'
          name: CONCURRENCY
          description: Parallel build branches inside one build (realistic mode only).
            Keep low — log flood + integration-test output scale with this and stream
            to the controller.
      - booleanParam:
          defaultValue: true
          name: COLD_CACHE
          description: Wipe workspace + Maven cache before building (realistic mode
            only)
      - string:
          trim: false
          defaultValue: sekharyr/cjoc-storage-benchmark
          name: DOCKERHUB_REPO
          description: Docker Hub repo (namespace/name) to tag and push the built
            workload image to (realistic mode only)
      - booleanParam:
          defaultValue: false
          name: TRIVY_HARD_FAIL
          description: Fail on Trivy-detected vulnerabilities instead of only reporting
            them (realistic mode only)
      - string:
          trim: false
          defaultValue: CRITICAL,HIGH
          name: TRIVY_SEVERITY
          description: Severities Trivy hard-fails on when TRIVY_HARD_FAIL is true
      - string:
          trim: false
          defaultValue: '50'
          name: LOG_FLOOD_SIZE_MB
          description: MB of log-shaped console output each Log flood branch writes
            (realistic mode only). Streams to the controller, so total ~= CONCURRENCY
            x this — keep modest for controller-memory safety.
      - string:
          trim: false
          name: STORAGE_RESOURCE_ID
          description: AWS resource ID backing this controller's JENKINS_HOME PVC
            for CloudWatch collection; blank = auto-select from STORAGE_CLASS. Only
            used in realistic mode.
      - string:
          trim: false
          defaultValue: '1'
          name: INTEGRATION_TEST_REPEAT
          description: Re-run the real mvnw verify this many times per branch (realistic
            mode only) — genuine Maven console output as controller log pressure
      - string:
          trim: false
          defaultValue: '1'
          name: ARTIFACT_COPY_COUNT
          description: Archive this many copies of the built jar per branch (realistic
            mode only) — real binary writes that ACCUMULATE on JENKINS_HOME across
            builds
  - buildDiscarder:
      strategy:
        logRotator:
          removeLastBuild: false
          artifactDaysToKeep: -1
          artifactNumToKeep: -1
          daysToKeep: -1
          numToKeep: 5
  resumeBlocked: false
