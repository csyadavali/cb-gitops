jenkins:
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  clouds:
  - kubernetes:
      containerCap: 10
      containerCapStr: "10"
      name: "bench-cloud-agent"
      namespace: "cloudbees-agents"
      templates:
      - agentInjection: true
        containers:
        - args: "9999999"
          command: "sleep"
          image: "maven:3.9-eclipse-temurin-21"
          livenessProbe:
            failureThreshold: 0
            initialDelaySeconds: 0
            periodSeconds: 0
            successThreshold: 0
            timeoutSeconds: 0
          name: "jnlp"
          workingDir: "/home/jenkins/agent"
        id: "5a27212e-a176-4085-aefa-473a3374b222"
        label: "bench-agent"
        name: "bench-agent"
        namespace: "cloudbees-agents"
        serviceAccount: "bench-agent-sa"
        yamlMergeStrategy: "override"
      webSocket: true
  crumbIssuer: "standard"
  disableRememberMe: false
  labelAtoms:
  - name: "bench-agent"
  - name: "built-in"
  log: {
    }
  markupFormatter: "plainText"
  mode: NORMAL
  noUsageStatistics: true
  nodeMonitors:
  - "architecture"
  - "clock"
  - diskSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "swapSpace"
  - tmpSpace:
      freeSpaceThreshold: "1GiB"
      freeSpaceWarningThreshold: "2GiB"
  - "responseTime"
  numExecutors: 0
  primaryView:
    all:
      name: "all"
  projectNamingStrategy: "standard"
  quietPeriod: 5
  remotingSecurity:
    enabled: true
  scmCheckoutRetryCount: 0
  securityRealm: "operationsCenter"
  slaveAgentPort: 50000
  updateCenter:
    sites:
    - id: "core-mm-offline"
      url: "file:/tmp/jenkins/war/WEB-INF/plugins/update-center.json"
    - id: "cap-core-mm"
      url: "https://jenkins-updates.cloudbees.com/update-center/envelope-core-mm/update-center.json"
  views:
  - all:
      name: "all"
  viewsTabBar: "standard"
