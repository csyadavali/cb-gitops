- kind: pipeline
  name: OnEBSPipeline
  concurrentBuild: true
  definition:
    cpsScmFlowDefinition:
      scriptPath: Jenkinsfile.orchestrator
      scm:
        scmGit:
          userRemoteConfigs:
          - userRemoteConfig:
              url: https://github.com/sekharyr/cjoc-storage-benchmark.git
          branches:
          - branchSpec:
              name: '*/main'
      lightweight: true
  description: ''
  disabled: false
  displayName: OnEBSPipeline
  properties:
  - githubProjectProperty:
      displayName: ''
      projectUrlStr: https://github.com/sekharyr/cjoc-storage-benchmark.git/
  - pipelineTriggers:
      triggers:
      - githubPush: {}
      - pollSCM:
          ignorePostCommitHooks: false
          scmpoll_spec: ''
  - parameters:
      parameterDefinitions:
      - choice:
          name: STORAGE_CLASS
          description: Informational label only — this job must already be scheduled
            onto the controller backed by this storage class
          choices:
          - ebs-gp3-sc
          - efs-sc
          - openzfs-sc
          - openzfs-ha-sc
      - string:
          trim: false
          defaultValue: '5'
          name: JOB_COUNT
          description: Number of target jobs to create/ensure exist (job-sprawl axis).
            Conservative default — benchDriver fans out JOB_COUNT x BUILD_ITERATIONS
            builds ALL AT ONCE (no throttle), and each concurrent build costs controller
            heap. 5 x 2 = 10 concurrent is a safe starting point on a ~1.5GB-heap
            controller; raise once you have confirmed headroom.
      - string:
          trim: false
          defaultValue: '2'
          name: BUILD_ITERATIONS
          description: Number of times each target job gets triggered per run (build-frequency
            axis). Kept low by default so the total concurrent fan-out (JOB_COUNT
            x BUILD_ITERATIONS) does not overwhelm the controller — see JOB_COUNT
            note.
      - string:
          trim: false
          defaultValue: '5'
          name: MAX_CONCURRENT
          description: Hard cap on builds in flight at once — benchDriver drives the
            JOB_COUNT x BUILD_ITERATIONS builds in sequential windows of this size,
            so the controller never sees more than this many concurrent builds no
            matter how high the counts go. Protects controller heap. Set >= JOB_COUNT
            x BUILD_ITERATIONS to fan out all at once (old behaviour).
      - booleanParam:
          defaultValue: false
          name: REALISTIC_SERVICE_MODE
          description: Off (default) = each triggered target build does minimal controller-side
            stamp work (the small-file storage signal; controller-memory-safe). On
            = each target build runs the FULL realistic service sequence (unit/integration
            test, log flood, docker build/trivy/push, soak, CloudWatch). Much heavier
            on agents AND controller (log flood streams to the controller) — combine
            with a low MAX_CONCURRENT.
      - string:
          trim: false
          defaultValue: '1'
          name: ARTIFACT_COPY_COUNT
          description: 'Realistic mode only: archive this many copies of the built
            ~60MB jar per target build (distinct files, real incompressible binary)
            into JENKINS_HOME/.../builds/<n>/archive. e.g. 34 -> ~2GB of artifact
            write per build. WARNING: accumulates across builds (bounded by buildDiscarder=5,
            so up to 5x2GB=10GB per job) and is multiplied by CONCURRENCY. Requires
            REALISTIC_SERVICE_MODE=true.'
      - string:
          trim: false
          defaultValue: '1'
          name: CONCURRENCY
          description: 'Realistic mode only: parallel build branches INSIDE each target
            build ("Layer 3" intra-build concurrency). Multiplies artifacts (CONCURRENCY
            x ARTIFACT_COPY_COUNT), log-flood volume (CONCURRENCY x LOG_FLOOD_SIZE_MB
            streamed to the controller), and agent pods used. Peak parallel work ~=
            MAX_CONCURRENT builds x CONCURRENCY branches — keep low; needs agent capacity.'
      - string:
          trim: false
          defaultValue: '50'
          name: LOG_FLOOD_SIZE_MB
          description: 'Realistic mode only: MB of log-shaped console each Log-flood
            branch streams to the controller; total per build ~= CONCURRENCY x this.
            Controller-memory lever — keep modest.'
      - string:
          trim: false
          defaultValue: https://github.com/sekharyr/cjoc-storage-benchmark
          name: REPO_URL
          description: Repo containing Jenkinsfile.target for the target jobs
      - string:
          trim: false
          defaultValue: main
          name: REPO_BRANCH
          description: Branch of REPO_URL the target jobs should check out
      - string:
          trim: false
          name: STORAGE_RESOURCE_ID
          description: The AWS resource ID backing this controller's JENKINS_HOME
            PVC — used for CloudWatch collection, same convention as Jenkinsfile/Jenkinsfile.max-survivability
  - durabilityHint:
      hint: MAX_SURVIVABILITY
  - buildDiscarder:
      strategy:
        logRotator:
          removeLastBuild: false
          artifactDaysToKeep: -1
          artifactNumToKeep: -1
          daysToKeep: -1
          numToKeep: 5
  resumeBlocked: false

