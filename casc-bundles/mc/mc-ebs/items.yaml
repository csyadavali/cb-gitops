- kind: folder
  name: folder001
  displayName: folder001
  items:
  - kind: pipeline
    name: pipeline001
    concurrentBuild: true
    definition:
      cpsFlowDefinition:
        sandbox: true
        script: |
          pipeline {
            agent {
              label 'python'
            }

            stages {
              stage('Setup Script') {
                steps {
                  writeFile file: 'generate-hex.py', text: '''#!/usr/bin/env python3
          """Generate random alphanumeric strings for testing."""

          import random
          import string
          import sys

          def generate_random_string(min_length=1, max_length=200):
              """Generate a random alphanumeric string of random length."""
              length = random.randint(min_length, max_length)
              chars = string.ascii_letters + string.digits
              return ''.join(random.choice(chars) for _ in range(length))

          def main():
              # Default to 5,000 lines, or use command line argument
              num_lines = int(sys.argv[1]) if len(sys.argv) > 1 else 5000

              for _ in range(num_lines):
                  print(generate_random_string(120, 120))

          if __name__ == '__main__':
              main()
          '''
                }
              }

              stage('Generate Random Strings 1') {
                steps {
                  sh 'python3 generate-hex.py 10000'
                }
              }

              stage('Generate Random Strings 2') {
                parallel {
                  stage('Generate Random Strings 3') {
                    steps {
                      sh 'python3 generate-hex.py 10000'
                    }
                  }

                  stage('Generate Random Strings 4') {
                    steps {
                      sh 'python3 generate-hex.py 10000'
                    }
                  }
                }
              }

              stage('Generate Random Strings 5') {
                steps {
                  sh 'python3 generate-hex.py 20000'
                }
              }
            }
          }
    disabled: false
    displayName: pipeline001
    resumeBlocked: false
